<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简效率工具箱 Pro Max (BlackPink Edition)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            /* === 核心配色：黑白粉 === */
            --primary: #ff3399;        /* 核心霓虹粉 */
            --primary-dark: #cc0066;   /* 深粉色 */
            --primary-light: #ff99cc;  /* 浅粉色 */
            
            --bg-color-start: #000000; /* 纯黑 */
            --bg-color-end: #1a1a1a;   /* 深灰 */
            
            --card-bg: rgba(30, 30, 30, 0.7); /* 卡片半透明黑 */
            --card-border: rgba(255, 51, 153, 0.3); /* 粉色微光边框 */
            
            --text-main: #ffffff;      /* 主文字白 */
            --text-muted: #a3a3a3;     /* 次级文字灰 */
            
            --input-bg: rgba(255, 255, 255, 0.08);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            /* 背景改为黑灰渐变 */
            background: linear-gradient(135deg, var(--bg-color-start) 0%, var(--bg-color-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* === 头部设计 === */
        .header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            /* 文字流光渐变：白 -> 粉 */
            background: linear-gradient(to right, #ffffff, #ff3399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* === 广告位 (磨砂黑) === */
        .ad-space {
            width: 100%;
            max-width: 1000px;
            height: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            color: var(--text-muted);
            backdrop-filter: blur(5px);
        }
        
        /* === 主容器 === */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            max-width: 1100px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        /* === 卡片设计 (核心风格) === */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            /* 边框带有淡淡的粉色 */
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            padding: 30px;
            transition: var(--transition);
        }
        
        .card:hover {
            transform: translateY(-8px);
            /* 悬停时边框变亮 */
            border-color: var(--primary);
            box-shadow: 0 15px 40px -10px rgba(255, 51, 153, 0.2);
        }
        
        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }
        
        /* === 输入控件 (黑底白字) === */
        label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }
        
        /* 滑动条优化 */
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            margin: 15px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary); /* 粉色滑块 */
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="number"], textarea {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
        }
        
        input[type="number"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 51, 153, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 51, 153, 0.1);
        }

        /* === 按钮 (粉色渐变) === */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        button {
            /* 粉色渐变背景 */
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 153, 0.5);
            filter: brightness(1.1);
        }
        
        button:disabled {
            background: #404040;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        /* === 结果框 === */
        .result-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary-light); /* 浅粉色文字 */
            font-weight: 700;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        
        /* === 倒计时大字 === */
        #timer-display {
            font-size: 4rem;
            text-align: center;
            margin: 20px 0;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 51, 153, 0.5); /* 霓虹发光效果 */
            font-family: monospace;
        }
        
        .timer-inputs { display: flex; gap: 16px; margin-bottom: 20px; }
        .timer-input-group { flex: 1; }

        /* === 大转盘区域 === */
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 24px auto;
            border-radius: 50%;
            /* 转盘外发光 */
            box-shadow: 0 0 30px rgba(255, 51, 153, 0.2); 
            border: 4px solid rgba(255, 255, 255, 0.1);
        }
        
        #wheelCanvas { width: 100%; height: 100%; }
        
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fff; /* 白色指针 */
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(255, 51, 153, 0.8));
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>极简效率工具箱</h1>
        <p class="subtitle">BLACK · WHITE · PINK</p>
    </div>

    <div class="ad-space">
        广告位：【狗头】【狗头】【狗头】
    </div>

    <div class="container">
        <!-- 1. 强密码生成器 -->
        <div class="card">
            <h2>🔐 强密码生成器</h2>
            <label>长度: <span id="len-val" style="color:var(--primary);">16</span>位</label>
            <input type="range" id="length" min="6" max="32" value="16" oninput="document.getElementById('len-val').innerText=this.value">
            <div style="margin: 16px 0;">
                <label><input type="checkbox" id="use-upper" checked> 包含大写 (A-Z)</label>
                <label><input type="checkbox" id="use-num" checked> 包含数字 (0-9)</label>
                <label><input type="checkbox" id="use-sym" checked> 包含符号 (!@#$)</label>
            </div>
            <button onclick="generatePassword()">生成密码</button>
            <div class="result-box" id="password-result">点击生成</div>
        </div>

        <!-- 2. 精确倒计时 -->
        <div class="card">
            <h2>⏳ 专注倒计时</h2>
            <div id="timer-display">25:00</div>
            <div class="timer-inputs">
                <div class="timer-input-group">
                    <label>分钟</label>
                    <input type="number" id="minutes-input" value="25" min="0" max="180" onchange="updateTimerFromInput()">
                </div>
                <div class="timer-input-group">
                    <label>秒数</label>
                    <input type="number" id="seconds-input" value="0" min="0" max="59" onchange="updateTimerFromInput()">
                </div>
            </div>
            <div class="button-group">
                <button id="btn-start" onclick="startTimer()">开始计时</button>
                <button class="secondary" onclick="resetTimer()">重置</button>
            </div>
        </div>

        <!-- 3. 幸运大转盘 -->
        <div class="card">
            <h2>🎡 幸运大转盘</h2>
            <label>输入选项 (一行一个):</label>
            <textarea id="wheel-choices" oninput="initWheel()" rows="5">火锅
烧烤
轻食沙拉
日料寿司
麻辣烫
不吃了</textarea>
            
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>
            
            <div class="result-box" id="wheel-result">准备起飞</div>
            <button onclick="spinWheel()" id="spin-btn">开始转动！</button>
        </div>
    </div>

    <script>
        // --- 1. 密码生成器 ---
        function generatePassword() {
            const length = document.getElementById('length').value;
            const useUpper = document.getElementById('use-upper').checked;
            const useNum = document.getElementById('use-num').checked;
            const useSym = document.getElementById('use-sym').checked;
            let chars = 'abcdefghijklmnopqrstuvwxyz';
            if(useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if(useNum) chars += '0123456789';
            if(useSym) chars += '!@#$%^&*()_+~`|}{[]:;?><,./-=';
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            // 动画
            const resultBox = document.getElementById('password-result');
            resultBox.style.opacity = '0.5';
            setTimeout(() => {
                resultBox.innerText = password;
                resultBox.style.opacity = '1';
                resultBox.style.borderColor = 'var(--primary)'; // 生成后边框变粉
            }, 100);
        }

        // --- 2. 倒计时 ---
        let timer = null;
        let totalSeconds = 25 * 60;
        let isRunning = false;
        
        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
            if(isRunning) document.title = `(${m}:${s}) 倒计时`;
            else document.title = "极简效率工具箱";
        }

        function updateTimerFromInput() {
            if (isRunning) return;
            let mins = parseInt(document.getElementById('minutes-input').value) || 0;
            let secs = parseInt(document.getElementById('seconds-input').value) || 0;
            if (secs > 59) { secs = 59; document.getElementById('seconds-input').value = 59; }
            if (mins < 0) mins = 0;
            totalSeconds = mins * 60 + secs;
            updateDisplay(totalSeconds);
        }

        function startTimer() {
            if(isRunning) return;
            if(totalSeconds <= 0) { alert("请先设置时间！"); return; }
            
            isRunning = true;
            toggleInputs(true);
            const btn = document.getElementById('btn-start');
            btn.innerText = "⏳ 专注中...";
            btn.style.boxShadow = "0 0 20px var(--primary)"; // 运行时按钮发光
            
            timer = setInterval(() => {
                if(totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay(totalSeconds);
                } else {
                    finishTimer();
                }
            }, 1000);
        }

        function finishTimer() {
            clearInterval(timer);
            isRunning = false;
            document.title = "【时间到！】";
            alert("⏰ 时间到！");
            resetUI();
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            updateTimerFromInput();
            resetUI();
        }

        function resetUI() {
            toggleInputs(false);
            const btn = document.getElementById('btn-start');
            btn.innerText = "开始计时";
            btn.style.boxShadow = "";
        }

        function toggleInputs(disabled) {
            document.getElementById('minutes-input').disabled = disabled;
            document.getElementById('seconds-input').disabled = disabled;
            document.getElementById('btn-start').disabled = disabled;
        }

        // --- 3. 大转盘 ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentRotation = 0;
        let isSpinning = false;
        let options = [];
        
        // 【配色更新】黑白粉专属配色
        const colors = [
            '#FF3399', // 霓虹粉
            '#1a1a1a', // 黑
            '#FFFFFF', // 白
            '#CC0066', // 深粉
            '#404040', // 灰
            '#FF99CC'  // 浅粉
        ];

        function initWheel() {
            if(isSpinning) return;
            const raw = document.getElementById('wheel-choices').value;
            options = raw.split('\n').map(s => s.trim()).filter(s => s !== "");
            if(options.length === 0) options = ['A', 'B'];
            drawWheel();
        }

        function drawWheel() {
            const numOptions = options.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            
            for (let i = 0; i < numOptions; i++) {
                const angle = i * arcSize;
                ctx.beginPath();
                // 循环使用配色
                const color = colors[i % colors.length];
                ctx.fillStyle = color;
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + arcSize);
                ctx.lineTo(0, 0);
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)"; // 微弱的分割线
                ctx.stroke();
                
                // 绘制文字
                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                // 智能文字颜色：如果是深色背景用白字，浅色背景用黑字
                if(color === '#FFFFFF' || color === '#FF99CC') {
                    ctx.fillStyle = "#000000";
                } else {
                    ctx.fillStyle = "#FFFFFF";
                }
                ctx.font = "bold 32px Arial";
                if(options[i].length > 5) ctx.font = "bold 24px Arial";
                ctx.fillText(options[i], radius - 30, 10);
                ctx.restore();
            }
            ctx.restore();
            canvas.style.transform = `rotate(${currentRotation}deg)`;
        }

        function spinWheel() {
            if (isSpinning) return;
            if (options.length < 2) { alert("至少输入2个选项！"); return; }

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.innerText = "转动中...";
            
            const spinAngle = (360 * 5) + Math.floor(Math.random() * 360) + (360 * Math.random());
            currentRotation -= spinAngle;
            
            canvas.style.transition = 'transform 4s cubic-bezier(0.2, 0.8, 0.3, 1)';
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "开始转动！";
                
                const actualRotation = currentRotation % 360;
                let angleUnderPointer = (270 - actualRotation) % 360;
                if (angleUnderPointer < 0) angleUnderPointer += 360;
                
                const sliceDeg = 360 / options.length;
                const index = Math.floor(angleUnderPointer / sliceDeg);
                const winner = options[index % options.length];
                
                const resultBox = document.getElementById('wheel-result');
                resultBox.innerText = "🎉 结果是： " + winner;
                resultBox.style.borderColor = "var(--primary)";
                
            }, 4000);
        }

        initWheel();
    </script>
</body>
</html>
